name: build and test

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
        tls: ["", "YES"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libssl-dev
      - name: Build and run HTTP integration checks
        run: make -j4 CC=${{ matrix.compiler }} USE_TLS=${{ matrix.tls }} test
