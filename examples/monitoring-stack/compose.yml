  #   volumes:
  #     - /proc:/host/proc:ro
  #     - /sys:/host/sys:ro
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #   restart: unless-stopped

networks:
  monitoring-network:
    driver: bridge

volumes:
  atop-logs:
