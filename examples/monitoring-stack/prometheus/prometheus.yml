global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'process-exporter'
    static_configs:
      - targets: ['process-exporter:9256']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'atophttpd'
    scrape_interval: 10s
    static_configs:
      - targets: ['atophttpd:2867']

